[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-chronicle"
version = "0.1.0"
description = "Shared reporting office for every agent in the fleet. Each agent gets a folder. Works offline or attached to PLATO."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
chronicle = "chronicle.cli:main"
